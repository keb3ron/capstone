<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
<!-- #1 
INSERT AN IMAGE -->
    <!-- Save an image in the same folder as this html file -->
    <!-- Add it to your page using the img tag -->
    <!-- Add alternate text under the alt attribute -->
    <img src="https://ichef.bbci.co.uk/ace/standard/1024/cpsprodpb/18bf/live/cd8fb080-a5f6-11f1-8348-fb0cb1cd9761.jpg" height=200 alt="A beautiful landscape">

<!-- #2
RESIZE IT  -->
    <!-- Copy the image tag above, but this time add more attributes -->
    <!-- Add the width attribute, then height, then both -->
    <img src="https://ichef.bbci.co.uk/ace/standard/1024/cpsprodpb/18bf/live/cd8fb080-a5f6-11f1-8348-fb0cb1cd9761.jpg" width=250 height=200 alt="A beautiful landscape">

<!-- #3
ADD A SIMPLE LINK  -->
    <!-- Create a simple text link with the anchor tag "a" -->
    <!-- Use a webite url in the href attribute -->
    <a href="https://en.wikipedia.org/wiki/Association_football">soccer</a>


<!-- #4
TURN AN IMAGE INTO A LINK -->
    <!-- Nest the image tag INSIDE the a tag.  -->
    <!-- You want to put it in between the open and close tags! -->

    <p><a href="https://en.wikipedia.org/wiki/Association_football"><img src="https://ichef.bbci.co.uk/ace/standard/1024/cpsprodpb/18bf/live/cd8fb080-a5f6-11f1-8348-fb0cb1cd9761.jpg" height=200 alt="A beautiful landscape"
<!-- #5
ADD A LINK TO ANOTHER HTML PAGE  -->
    <!-- Add another a tag, but this time, use the relative path for the href attribute -->
    <!-- The full path is what you can open in your browser BUT only on your computer -->
    <!-- The relative path takes you from your current location (in this case this folder) so it will work in github when you push your folder -->
    <a href="index.html">index</a>


</body>
</html>
